services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - ./data:/data
    expose:
      - "8080"

  # Caddy сам получает и продлевает HTTPS-сертификат для твоего домена
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # VPN-клиент (VLESS) — только чтобы бот достучался до Telegram.
  # Включается строкой COMPOSE_PROFILES=vpn в .env, конфиг xray.json создаёт скрипт vless-to-xray.
  xray:
    image: teddysun/xray
    profiles:
      - vpn
    restart: unless-stopped
    volumes:
      - ./xray.json:/etc/xray/config.json:ro

volumes:
  caddy_data:
  caddy_config:
